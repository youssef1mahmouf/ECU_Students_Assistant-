<!DOCTYPE html>
<!--
  The ECU mark as a favicon. Same-origin SVG, so it satisfies the CSP with no
  extra request and scales cleanly on a high-density screen. The mark reuses the
  primary gradient of the design system.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ECU">
  <defs>
    <linearGradient id="m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a2fc4"/>
      <stop offset="1" stop-color="#311d87"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#m)"/>
  <text x="32" y="41" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700"
        letter-spacing="1" text-anchor="middle" fill="#ffffff">ECU</text>
</svg>
