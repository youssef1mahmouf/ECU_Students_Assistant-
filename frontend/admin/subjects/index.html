<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f5fb">
  <meta name="robots" content="noindex">
  <title>المواد</title>
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/shell.css">
  <link rel="icon" href="/shared/favicon.svg" type="image/svg+xml">
  <script src="/shared/theme-boot.js"></script>
</head>
<body data-page-title="title.subjects">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">تخطي إلى المحتوى</a>

  <div class="app">
    <header class="topbar" id="appHeader"></header>

    <div class="app__body">
      <aside class="sidebar" id="appSidebar"></aside>

      <main class="page" id="main">

        <div class="page-head">
          <div class="page-head__text">
            <p class="eyebrow" data-i18n="nav.subjects">المواد</p>
            <h1 data-i18n="admin.subjectsManage">إدارة المواد</h1>
            <p class="lead" data-i18n="admin.subjectsNote">المواد تنظّم ملفات كل مجموعة. المرجع المختصر يسمّي مجلد التخزين ولا يتغيّر بعد الإنشاء.</p>
          </div>
        </div>

        <!-- id="subjectRows" is asserted by backend/scripts/page-smoke.js -->
        <div id="subjectRows"></div>
        <p class="message" id="subjectMessage" role="status" aria-live="polite" style="margin-block-start:var(--space-3)"></p>
      </main>
    </div>

    <footer class="footer" id="appFooter"></footer>
  </div>

  <script type="module" src="/admin/scripts/subjects.js"></script>
</body>
</html>
