<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f5fb">
  <meta name="robots" content="noindex">
  <title>الحسابات</title>
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/shell.css">
  <link rel="icon" href="/shared/favicon.svg" type="image/svg+xml">
  <script src="/shared/theme-boot.js"></script>
</head>
<body data-page-title="title.accounts">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">تخطي إلى المحتوى</a>

  <div class="app">
    <header class="topbar" id="appHeader"></header>

    <div class="app__body">
      <aside class="sidebar" id="appSidebar"></aside>

      <main class="page" id="main">

        <div class="page-head">
          <div class="page-head__text">
            <p class="eyebrow" data-i18n="admin.accounts">الحسابات</p>
            <h1 data-i18n="admin.accountsManage">إدارة الحسابات</h1>
            <p class="lead" data-i18n="admin.accountsNote">اعتماد الانضمام، التعطيل، تغيير المجموعة، إعادة تعيين كلمة المرور. السوبر أدمن فقط يغيّر الأدوار أو يدير حسابات الأدمن.</p>
          </div>
        </div>

        <div class="toolbar" id="accountsToolbar" hidden>
          <div class="field">
            <label class="label" for="accountSearch" data-i18n="action.search">بحث</label>
            <input class="control" id="accountSearch" type="search" autocomplete="off"
                   data-i18n-placeholder="library.searchPlaceholder">
          </div>
          <div class="field">
            <label class="label" for="accountStatus" data-i18n="field.status">الحالة</label>
            <select class="control" id="accountStatus">
              <option value="" data-i18n="filter.all">الكل</option>
              <option value="pending" data-i18n="state.pending">بانتظار الاعتماد</option>
              <option value="confirmed" data-i18n="state.confirmed">معتمد</option>
              <option value="staff" data-i18n="admin.filterStaff">طاقم</option>
            </select>
          </div>
          <span class="toolbar__spacer"></span>
          <span class="count-pill" id="accountCount">0</span>
        </div>

        <!-- id="accountRows" is asserted by backend/scripts/page-smoke.js -->
        <div id="accountRows"></div>
        <p class="message" id="accountMessage" role="status" aria-live="polite" style="margin-block-start:var(--space-3)"></p>
      </main>
    </div>

    <footer class="footer" id="appFooter"></footer>
  </div>

  <script type="module" src="/admin/scripts/accounts.js"></script>
</body>
</html>
