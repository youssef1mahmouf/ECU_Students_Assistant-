<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f5fb">
  <meta name="robots" content="noindex">
  <title>المجموعات والمحتوى</title>
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/shell.css">
  <link rel="icon" href="/shared/favicon.svg" type="image/svg+xml">
  <script src="/shared/theme-boot.js"></script>
</head>
<body data-page-title="title.groupsAdmin">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">تخطي إلى المحتوى</a>

  <div class="app">
    <header class="topbar" id="appHeader"></header>

    <div class="app__body">
      <aside class="sidebar" id="appSidebar"></aside>

      <main class="page" id="main">

        <div class="page-head">
          <div class="page-head__text">
            <p class="eyebrow" data-i18n="admin.groups">المجموعات</p>
            <h1 data-i18n="admin.groupsManage">إدارة المجموعات</h1>
            <p class="lead" data-i18n="admin.groupsNote">إنشاء المجموعات، إعادة تسميتها، وحذفها مع محتواها.</p>
          </div>
        </div>

        <section class="page__section" aria-labelledby="groups-heading">
          <h2 id="groups-heading" data-i18n="admin.groups">المجموعات</h2>
          <!-- id="groupRows" is asserted by backend/scripts/page-smoke.js -->
          <div class="grid-auto" id="groupRows"></div>
          <p class="message" id="groupMessage" role="status" aria-live="polite" style="margin-block-start:var(--space-3)"></p>
        </section>

        <section class="page__section" aria-labelledby="content-heading">
          <div class="section__head">
            <h2 id="content-heading" data-i18n="admin.content">المحتوى</h2>
          </div>
          <div class="toolbar">
            <div class="field">
              <label class="label" for="contentGroup" data-i18n="field.group">المجموعة</label>
              <select class="control" id="contentGroup"></select>
            </div>
          </div>
          <!-- id="contentRows" holds the published/draft content table. -->
          <div id="contentRows"></div>
          <p class="message" id="contentMessage" role="status" aria-live="polite" style="margin-block-start:var(--space-3)"></p>
        </section>

        <section class="page__section" aria-labelledby="record-heading">
          <h2 id="record-heading" data-i18n="admin.newRecord">محتوى جديد</h2>
          <form id="recordForm">
            <div class="form-grid">
              <div class="field field--full">
                <label class="label" for="recordGroups" data-i18n="field.groups">المجموعات</label>
                <select class="control" id="recordGroups" name="groups" multiple size="4" required></select>
              </div>
              <div class="field">
                <label class="label" for="recordTitle" data-i18n="field.title">العنوان</label>
                <input class="control" id="recordTitle" name="title" maxlength="140" required>
              </div>
              <div class="field">
                <label class="label" for="recordKind" data-i18n="field.kind">النوع</label>
                <input class="control" id="recordKind" name="kind" maxlength="40">
              </div>
              <div class="field">
                <label class="label" for="recordDueDate" data-i18n="field.dueDate">تاريخ التسليم</label>
                <input class="control" id="recordDueDate" name="dueDate" type="date">
              </div>
              <div class="field">
                <label class="label" for="recordSummary" data-i18n="field.summary">ملخص</label>
                <input class="control" id="recordSummary" name="summary" maxlength="280">
              </div>
              <div class="field field--full">
                <label class="label" for="recordBody" data-i18n="field.body">المحتوى</label>
                <textarea class="control" id="recordBody" name="body" rows="5" maxlength="4000"></textarea>
              </div>
              <div class="field field--full">
                <label class="check">
                  <input type="checkbox" name="published">
                  <span data-i18n="field.publishedToStudents">متاح للطلاب</span>
                </label>
              </div>
            </div>
            <div class="cluster" style="margin-block-start:var(--space-4)">
              <button class="btn btn--primary" type="submit" id="recordSubmit" data-i18n="action.create">إنشاء</button>
            </div>
            <p class="message" id="recordMessage" role="status" aria-live="polite" style="margin-block-start:var(--space-3)"></p>
          </form>
        </section>
      </main>
    </div>

    <footer class="footer" id="appFooter"></footer>
  </div>

  <script type="module" src="/admin/scripts/groups.js"></script>
</body>
</html>
