<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>البلاغات · بوابة المجموعات</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body data-page-title="title.problems">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">تخطي إلى المحتوى</a>
  <header class="topbar" id="appHeader"></header>

  <main id="main" class="shell">
    <section class="surface">
      <p class="eyebrow" data-i18n="admin.problems">البلاغات</p>
      <h1 data-i18n="admin.problemsManage">بلاغات المشاكل</h1>
      <p class="subtext" data-i18n="admin.problemsNote">بلاغات المستخدمين المحفوظة مع المُبلِّغ والوقت والصفحة والتصنيف.</p>

      <div class="filter-bar">
        <div class="field">
          <label for="problemStatusFilter" data-i18n="admin.problemStatus">الحالة</label>
          <select id="problemStatusFilter">
            <option value="" data-i18n="filter.all">الكل</option>
            <option value="open" data-i18n="state.open">مفتوح</option>
            <option value="resolved" data-i18n="state.resolved">تم الحل</option>
          </select>
        </div>
        <div class="field"><button class="btn secondary" id="refreshProblems" type="button" data-i18n="action.refresh">تحديث</button></div>
      </div>

      <div class="table-wrap">
        <table>
          <caption id="problemsCaption" data-i18n="admin.problemList">قائمة البلاغات</caption>
          <thead>
            <tr>
              <th scope="col" data-i18n="admin.problemReporter">المُبلِّغ</th>
              <th scope="col" data-i18n="admin.problemTime">الوقت</th>
              <th scope="col" data-i18n="admin.problemCategory">التصنيف</th>
              <th scope="col" data-i18n="admin.problemDescription">الوصف</th>
              <th scope="col" data-i18n="admin.problemPage">الصفحة</th>
              <th scope="col" data-i18n="admin.problemStatus">الحالة</th>
              <th scope="col" data-i18n="field.actions">إجراءات</th>
            </tr>
          </thead>
          <tbody id="problemRows">
            <tr><td colspan="7" class="empty" data-i18n="msg.loading">جار التحميل…</td></tr>
          </tbody>
        </table>
      </div>
      <p class="message" id="problemMessage" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer class="shell" id="appFooter"></footer>
  <script type="module" src="/admin/scripts/problems.js"></script>
</body>
</html>
