<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f5fb">
  <meta name="robots" content="noindex">
  <title>البلاغات</title>
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/shell.css">
  <link rel="icon" href="/shared/favicon.svg" type="image/svg+xml">
  <script src="/shared/theme-boot.js"></script>
</head>
<body data-page-title="title.problems">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">تخطي إلى المحتوى</a>

  <div class="app">
    <header class="topbar" id="appHeader"></header>

    <div class="app__body">
      <aside class="sidebar" id="appSidebar"></aside>

      <main class="page" id="main">

        <div class="page-head">
          <div class="page-head__text">
            <p class="eyebrow" data-i18n="admin.problems">البلاغات</p>
            <h1 data-i18n="admin.problemsManage">بلاغات المشاكل</h1>
            <p class="lead" data-i18n="admin.problemsNote">بلاغات المستخدمين المحفوظة مع المُبلِّغ والوقت والصفحة والتصنيف.</p>
          </div>
        </div>

        <div class="toolbar">
          <div class="field">
            <label class="label" for="problemStatusFilter" data-i18n="admin.problemStatus">الحالة</label>
            <select class="control" id="problemStatusFilter">
              <option value="" data-i18n="filter.all">الكل</option>
              <option value="open" data-i18n="state.open">مفتوح</option>
              <option value="resolved" data-i18n="state.resolved">تم الحل</option>
            </select>
          </div>
          <span class="toolbar__spacer"></span>
          <span class="count-pill" id="problemCount">0</span>
        </div>

        <!-- id="problemRows" is asserted by backend/scripts/page-smoke.js -->
        <div id="problemRows"></div>
        <p class="message" id="problemMessage" role="status" aria-live="polite" style="margin-block-start:var(--space-3)"></p>
      </main>
    </div>

    <footer class="footer" id="appFooter"></footer>
  </div>

  <script type="module" src="/admin/scripts/problems.js"></script>
</body>
</html>
