<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>سجل النشاط · بوابة المجموعات</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body data-page-title="title.activity">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">تخطي إلى المحتوى</a>
  <header class="topbar" id="appHeader"></header>

  <main id="main" class="shell">
    <section class="surface">
      <p class="eyebrow" data-i18n="admin.activity">سجل النشاط</p>
      <h1 data-i18n="admin.events">الأحداث المسجّلة</h1>
      <p class="subtext" data-i18n="admin.logNote">لا يتضمن السجل أي كلمات مرور. السجل في وضع SQLite لا يُمسح من الواجهة.</p>

      <div class="filter-bar">
        <div class="field">
          <label for="activityWho" data-i18n="admin.showWho">عرض</label>
          <select id="activityWho">
            <option value="" data-i18n="filter.all">الكل</option>
            <option value="admin" data-i18n="filter.admin">إداري</option>
            <option value="user" data-i18n="filter.students">الطلاب</option>
          </select>
        </div>
        <div class="field">
          <label for="activityActor" data-i18n="admin.actorLabel">الشخص</label>
          <select id="activityActor"><option value="" data-i18n="admin.allActors">كل الأشخاص</option></select>
        </div>
        <div class="field">
          <label for="activityLevel" data-i18n="field.level">المستوى</label>
          <select id="activityLevel">
            <option value="" data-i18n="filter.all">الكل</option>
            <option value="auth" data-i18n="filter.auth">دخول</option>
            <option value="security" data-i18n="filter.security">أمني</option>
            <option value="admin" data-i18n="filter.admin">إداري</option>
            <option value="info" data-i18n="filter.info">معلومة</option>
          </select>
        </div>
        <div class="field">
          <label for="activityLimit" data-i18n="field.limit">العدد</label>
          <select id="activityLimit">
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="250">250</option>
            <option value="500">500</option>
          </select>
        </div>
        <div class="field"><button class="btn secondary" id="refreshActivity" type="button" data-i18n="action.refresh">تحديث</button></div>
      </div>

      <ul class="log" id="activityList"><li data-i18n="msg.loading">جار التحميل…</li></ul>
    </section>

    <dialog class="app-dialog" id="eventDialog" aria-labelledby="eventDialogTitle">
      <h2 id="eventDialogTitle" data-i18n="admin.eventDetails">تفاصيل الحدث</h2>
      <dl id="eventBody"></dl>
      <div class="dialog-actions">
        <button class="btn secondary" type="button" id="eventClose" data-i18n="action.close">إغلاق</button>
      </div>
    </dialog>
  </main>

  <footer class="shell" id="appFooter"></footer>
  <script type="module" src="/admin/scripts/activity.js"></script>
</body>
</html>
