<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f5fb">
  <meta name="robots" content="noindex">
  <title>فهرس المكتبة</title>
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/shell.css">
  <link rel="stylesheet" href="/shared/library.css">
  <link rel="icon" href="/shared/favicon.svg" type="image/svg+xml">
  <script src="/shared/theme-boot.js"></script>
</head>
<body data-page-title="title.libraryAdmin">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">تخطي إلى المحتوى</a>

  <div class="app">
    <header class="topbar" id="appHeader"></header>

    <div class="app__body">
      <aside class="sidebar" id="appSidebar"></aside>

      <main class="page" id="main">

        <div class="page-head">
          <div class="page-head__text">
            <p class="eyebrow" data-i18n="nav.libraryAdmin">فهرس المكتبة</p>
            <h1 data-i18n="admin.library">فهرس المكتبة</h1>
            <p class="lead" data-i18n="library.subtitle">فهرس المواد الدراسية المشترك: المواد ثم الأسابيع ثم الجلسات ثم الملفات.</p>
          </div>
        </div>

        <div class="toolbar">
          <label class="search" for="adminLibrarySearch">
            <span class="visually-hidden" data-i18n="library.search">ابحث</span>
            <svg viewBox="0 0 24 24" width="1.05rem" height="1.05rem" aria-hidden="true" focusable="false">
              <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path>
            </svg>
            <input class="control" id="adminLibrarySearch" type="search" autocomplete="off"
                   data-i18n-placeholder="library.searchPlaceholder">
          </label>
          <button class="btn btn--secondary" type="button" id="adminLibraryRefresh" data-i18n="action.refresh">
            تحديث</button>
        </div>

        <div id="adminLibrary"></div>
        <p class="tiny subtle" style="margin-block-start:var(--space-3)" data-i18n="admin.libraryNote">
          الفهرس يُولَّد من مجلد المواد على الخادم عبر npm run import:library.</p>
      </main>
    </div>

    <footer class="footer" id="appFooter"></footer>
  </div>

  <script type="module" src="/admin/scripts/library.js"></script>
</body>
</html>
