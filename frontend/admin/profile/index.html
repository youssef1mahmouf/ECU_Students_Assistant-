<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f5fb">
  <meta name="robots" content="noindex">
  <title>حسابي</title>
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/shell.css">
  <link rel="icon" href="/shared/favicon.svg" type="image/svg+xml">
  <script src="/shared/theme-boot.js"></script>
</head>
<body data-page-title="title.adminProfile">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">تخطي إلى المحتوى</a>

  <div class="app">
    <header class="topbar" id="appHeader"></header>

    <div class="app__body">
      <aside class="sidebar" id="appSidebar"></aside>

      <main class="page" id="main">

        <div class="page-head">
          <div class="page-head__text">
            <p class="eyebrow" data-i18n="nav.profile">الملف الشخصي</p>
            <h1 data-i18n="profile.title">ملفي</h1>
            <p class="lead" data-i18n="profile.subtitle">بياناتك كما يراها النظام. الاسم فقط قابل للتعديل.</p>
          </div>
        </div>

        <section class="card" aria-labelledby="identity-heading">
          <h2 class="card__title" id="identity-heading" data-i18n="profile.details">بيانات الحساب</h2>
          <div class="definition-grid" id="identityFacts"></div>
        </section>

        <section class="page__section" aria-labelledby="name-heading">
          <div class="card">
            <h2 class="card__title" id="name-heading" data-i18n="profile.details">تعديل الاسم</h2>
            <!-- id="profileForm" is asserted by backend/scripts/page-smoke.js -->
            <form id="profileForm">
              <div class="field">
                <label class="label" for="profileInputName" data-i18n="field.name">الاسم</label>
                <input class="control" id="profileInputName" name="name" maxlength="80" required>
              </div>
              <div class="cluster" style="margin-block-start:var(--space-4)">
                <button class="btn btn--primary" type="submit" id="profileSubmit" data-i18n="action.save">حفظ</button>
              </div>
              <p class="message" id="profileMessage" role="status" aria-live="polite" style="margin-block-start:var(--space-3)"></p>
            </form>
          </div>
        </section>

        <section class="page__section" aria-labelledby="password-heading">
          <div class="card">
            <h2 class="card__title" id="password-heading" data-i18n="profile.changePassword">تغيير كلمة المرور</h2>
            <form id="passwordForm" autocomplete="off">
              <div class="form-grid">
                <div class="field">
                  <label class="label" for="currentPassword" data-i18n="field.currentPassword">كلمة المرور الحالية</label>
                  <input class="control" id="currentPassword" name="currentPassword" type="password"
                         autocomplete="current-password" required>
                </div>
                <div class="field">
                  <label class="label" for="newPassword" data-i18n="field.newPassword">كلمة المرور الجديدة</label>
                  <input class="control" id="newPassword" name="newPassword" type="password"
                         autocomplete="new-password" minlength="8" required>
                  <span class="hint" data-i18n="profile.passwordHint">سيتم إغلاق الجلسات الأخرى.</span>
                </div>
              </div>
              <div class="cluster" style="margin-block-start:var(--space-4)">
                <button class="btn btn--primary" type="submit" id="passwordSubmit" data-i18n="action.changePassword">
                  تغيير كلمة المرور</button>
              </div>
              <p class="message" id="passwordMessage" role="status" aria-live="polite" style="margin-block-start:var(--space-3)"></p>
            </form>
          </div>
        </section>
      </main>
    </div>

    <footer class="footer" id="appFooter"></footer>
  </div>

  <script type="module" src="/admin/scripts/profile.js"></script>
</body>
</html>
