<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>الملف الشخصي · بوابة المجموعات</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body data-page-title="title.profile">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">تخطي إلى المحتوى</a>
  <header class="topbar" id="appHeader"></header>

  <main id="main" class="shell">
    <section class="surface profile-head">
      <div class="avatar" id="profileAvatar" aria-hidden="true">··</div>
      <div>
        <h1 id="profileName" data-i18n="profile.title">الملف الشخصي</h1>
        <p class="subtext" id="profileMeta" data-i18n="profile.subtext">بيانات الحساب وكلمة المرور.</p>
      </div>
    </section>

    <section class="surface" aria-labelledby="name-heading">
      <h2 id="name-heading" data-i18n="profile.details">بيانات الحساب</h2>
      <form id="profileForm">
        <div class="form-grid">
          <div class="field">
            <label for="profileInputName" data-i18n="field.name">الاسم</label>
            <input id="profileInputName" name="name" maxlength="80" required>
          </div>
          <div class="field">
            <label for="profileEmail" data-i18n="field.email">البريد الإلكتروني</label>
            <input id="profileEmail" name="email" type="email" disabled>
          </div>
          <div class="field full">
            <label for="profileRosterName" data-i18n="profile.rosterName">الاسم الكامل في القائمة الرسمية</label>
            <input id="profileRosterName" type="text" disabled>
            <span class="hint" data-i18n="profile.rosterNote">الاسم كما ورد في ملف المجموعة المعتمد، ولا يتغيّر من هنا.</span>
          </div>
        </div>
        <div class="actions">
          <button class="btn" type="submit" id="profileSubmit" data-i18n="action.save">حفظ</button>
        </div>
        <p class="message" id="profileMessage" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="surface" aria-labelledby="password-heading">
      <h2 id="password-heading" data-i18n="profile.changePassword">تغيير كلمة المرور</h2>
      <p class="subtext" data-i18n="profile.passwordHint">سيتم إغلاق الجلسات في الأجهزة الأخرى بعد التغيير.</p>
      <form id="passwordForm">
        <div class="form-grid">
          <div class="field">
            <label for="currentPassword" data-i18n="field.currentPassword">كلمة المرور الحالية</label>
            <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
          </div>
          <div class="field">
            <label for="newPassword" data-i18n="field.newPassword">كلمة المرور الجديدة</label>
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required>
          </div>
        </div>
        <div class="actions">
          <button class="btn" type="submit" id="passwordSubmit" data-i18n="action.changePassword">تغيير كلمة المرور</button>
        </div>
        <p class="message" id="passwordMessage" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="shell" id="appFooter"></footer>
  <script type="module" src="/admin/scripts/profile.js"></script>
</body>
</html>
