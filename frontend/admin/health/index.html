<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f5fb">
  <meta name="robots" content="noindex">
  <title>صحة النظام</title>
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/shell.css">
  <link rel="icon" href="/shared/favicon.svg" type="image/svg+xml">
  <script src="/shared/theme-boot.js"></script>
</head>
<body data-page-title="title.health">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">تخطي إلى المحتوى</a>

  <div class="app">
    <header class="topbar" id="appHeader"></header>

    <div class="app__body">
      <aside class="sidebar" id="appSidebar"></aside>

      <main class="page" id="main">

        <div class="page-head">
          <div class="page-head__text">
            <p class="eyebrow" data-i18n="nav.health">صحة النظام</p>
            <h1 data-i18n="nav.health">صحة النظام</h1>
            <p class="lead" id="healthLead" data-i18n="admin.healthNote">الحالة كما يبلّغ عنها الخادم مباشرة.</p>
          </div>
        </div>

        <div id="healthStatus"></div>

        <section class="page__section" aria-labelledby="health-facts">
          <h2 id="health-facts" data-i18n="admin.healthFacts">تفاصيل الخدمة</h2>
          <div id="healthFacts"></div>
        </section>

        <section class="page__section" aria-labelledby="health-actions">
          <h2 id="health-actions" data-i18n="admin.healthActions">إجراءات</h2>
          <div class="cluster">
            <button class="btn btn--secondary" type="button" id="healthRefresh" data-i18n="action.refresh">تحديث</button>
          </div>
        </section>
      </main>
    </div>

    <footer class="footer" id="appFooter"></footer>
  </div>

  <script type="module" src="/admin/scripts/health.js"></script>
</body>
</html>
