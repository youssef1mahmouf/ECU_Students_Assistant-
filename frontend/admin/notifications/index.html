<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f5fb">
  <meta name="robots" content="noindex">
  <title>إشعارات النظام</title>
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/shell.css">
  <link rel="icon" href="/shared/favicon.svg" type="image/svg+xml">
  <script src="/shared/theme-boot.js"></script>
</head>
<body data-page-title="title.notificationsAdmin">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">تخطي إلى المحتوى</a>

  <div class="app">
    <header class="topbar" id="appHeader"></header>

    <div class="app__body">
      <aside class="sidebar" id="appSidebar"></aside>

      <main class="page" id="main">

        <div class="page-head">
          <div class="page-head__text">
            <p class="eyebrow" data-i18n="nav.notifications">الإشعارات</p>
            <h1 data-i18n="notif.title">الإشعارات</h1>
            <p class="lead" data-i18n="notif.sourceNote">هذه الإشعارات مبنية على السجل الفعلي في الخادم، ولا تحتوي أي بيانات تجريبية.</p>
          </div>
        </div>

        <div class="toolbar">
          <div class="segmented" role="group" id="adminNotifFilter">
            <button class="segmented__option is-active" type="button" data-level="" aria-pressed="true">
              <span data-i18n="notif.filterAll">الكل</span></button>
            <button class="segmented__option" type="button" data-level="security" aria-pressed="false">
              <span data-i18n="level.security">أمني</span></button>
            <button class="segmented__option" type="button" data-level="admin" aria-pressed="false">
              <span data-i18n="level.admin">إداري</span></button>
          </div>
          <span class="toolbar__spacer"></span>
          <span class="count-pill" id="adminNotifCount">0</span>
          <button class="btn btn--secondary btn--sm" type="button" id="adminNotifRefresh" data-i18n="action.refresh">
            تحديث</button>
        </div>

        <div id="adminNotifications"></div>
      </main>
    </div>

    <footer class="footer" id="appFooter"></footer>
  </div>

  <script type="module" src="/admin/scripts/notifications.js"></script>
</body>
</html>
