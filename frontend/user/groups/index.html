<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المجموعات · بوابة المجموعات</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/user/styles.css">
</head>
<body data-page-title="title.groups">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">تخطي إلى المحتوى</a>
  <header class="topbar" id="appHeader"></header>

  <main id="main" class="shell">
    <div id="userBanner"></div>
    <section class="surface">
      <p class="eyebrow" data-i18n="nav.groups">المجموعات</p>
      <h1 data-i18n="user.pickGroup">اختيار المجموعة</h1>
      <p class="subtext" data-i18n="user.pickGroupNote">تغيير المجموعة يحتاج اعتمادًا جديدًا من الأدمن.</p>
      <div class="group-grid" id="groupCards"><p class="empty" data-i18n="msg.loading">جار التحميل…</p></div>
      <p class="message" id="groupMessage" role="status" aria-live="polite"></p>
    </section>

    <section class="surface" aria-labelledby="group-content-heading">
      <h2 id="group-content-heading" data-i18n="user.groupContent">محتوى المجموعة</h2>
      <div class="list" id="groupRecords"><p class="empty" data-i18n="msg.loading">جار التحميل…</p></div>
    </section>
  </main>

  <footer class="shell" id="appFooter"></footer>
  <script type="module" src="/user/scripts/groups.js"></script>
</body>
</html>
