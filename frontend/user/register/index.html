<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f5fb">
  <title>إنشاء كلمة مرور</title>
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/shell.css">
  <link rel="icon" href="/shared/favicon.svg" type="image/svg+xml">
  <script src="/shared/theme-boot.js"></script>
</head>
<body data-page-title="title.register">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">تخطي إلى المحتوى</a>

  <div class="app">
    <header class="topbar" id="appHeader"></header>

    <div class="app__body app__body--auth">
      <main class="page auth-layout" id="main">
        <section class="card auth-layout__card">
          <p class="eyebrow" data-i18n="nav.register">حساب جديد</p>
          <h1 style="margin-block:var(--space-2) var(--space-2)" data-i18n="user.registerTitle">
            إنشاء كلمة مرور</h1>
          <p class="muted small" data-i18n="user.registerNote">
            التسجيل مغلق؛ يُقبل فقط البريد المدرج في القائمة الرسمية.</p>

          <form id="registerForm" novalidate>
            <div class="field" style="margin-block:var(--space-4)">
              <label class="label" for="newEmail" data-i18n="field.email">البريد الإلكتروني</label>
              <input class="control" id="newEmail" name="email" type="email" inputmode="email"
                     autocomplete="username" dir="ltr" required
                     data-i18n-placeholder="field.emailExample" placeholder="192600250@ecu.edu.eg">
            </div>

            <!-- The six-digit code step is shown only after the server accepts
                 the address. Same rule as the password step on the sign-in page. -->
            <div class="field" id="codeStep" hidden style="margin-block-end:var(--space-4)">
              <label class="label" for="emailCode" data-i18n="field.code">رمز التحقق</label>
              <div class="cluster cluster--tight">
                <input class="control" id="emailCode" name="code" type="text" inputmode="numeric"
                       pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" dir="ltr"
                       placeholder="000000" style="flex:1 1 8rem">
                <button class="btn btn--secondary" type="button" id="sendCode" data-i18n="action.sendCode">
                  إرسال الرمز</button>
                <button class="btn btn--secondary" type="button" id="verifyCode" data-i18n="action.verifyCode">
                  تأكيد الرمز</button>
              </div>
              <span class="hint" data-i18n="user.codeHint">أرسل الرمز إلى بريدك ثم أدخله هنا.</span>
            </div>

            <div class="field" id="passwordStep" hidden>
              <label class="label" for="newPassword" data-i18n="field.password">كلمة المرور</label>
              <input class="control" id="newPassword" name="password" type="password"
                     autocomplete="new-password" minlength="8" required>
              <span class="hint" data-i18n="field.passwordPolicy">
                حرف كبير ورقم ورمز، 8 أحرف على الأقل.</span>
            </div>
            <div class="field" id="confirmStep" hidden>
              <label class="label" for="newPasswordConfirm" data-i18n="field.passwordConfirm">
                تأكيد كلمة المرور</label>
              <input class="control" id="newPasswordConfirm" name="passwordConfirm" type="password"
                     autocomplete="new-password" minlength="8" required>
            </div>

            <div class="auth-actions" style="margin-block-start:var(--space-4)">
              <button class="btn btn--primary" type="submit" id="registerSubmit" data-i18n="action.createPassword">
                إنشاء كلمة المرور</button>
            </div>
            <p class="message" id="registerMessage" role="status" aria-live="polite" style="margin-block-start:var(--space-3)"></p>
          </form>

          <p class="tiny subtle" style="margin-block-start:var(--space-4)" data-i18n="user.registerApprovalNote">
            بعد الإنشاء يعتمد الأدمن عضويتك في المجموعة قبل فتح المحتوى.</p>
          <a class="small" href="/user/signin/" data-i18n="action.haveAccount">لدي حساب بالفعل</a>
        </section>
      </main>
    </div>

    <footer class="footer" id="appFooter"></footer>
  </div>

  <script type="module" src="/user/scripts/register.js"></script>
</body>
</html>
