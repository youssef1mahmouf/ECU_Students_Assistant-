<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f5fb">
  <meta name="robots" content="noindex">
  <title>ملفات مجموعتي</title>
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/shell.css">
  <link rel="icon" href="/shared/favicon.svg" type="image/svg+xml">
  <script src="/shared/theme-boot.js"></script>
</head>
<body data-page-title="title.documentsUser">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">تخطي إلى المحتوى</a>

  <div class="app">
    <header class="topbar" id="appHeader"></header>

    <div class="app__body">
      <aside class="sidebar" id="appSidebar"></aside>

      <main class="page" id="main">
        <div class="page-head">
          <div class="page-head__text">
            <p class="eyebrow" data-i18n="nav.documents">الملفات</p>
            <h1 data-i18n="documents.title">ملفات مجموعتي</h1>
            <p class="lead" id="documentsLead" data-i18n="documents.subtitle">ملفات مجموعتك فقط.</p>
          </div>
          <div class="page-head__actions">
            <!-- The library index is a different data set with its own page; this
                 link is the only place the two pages reference each other. -->
            <a class="btn btn--secondary" href="/user/library/">
              <svg viewBox="0 0 24 24" width="1.05rem" height="1.05rem" aria-hidden="true" focusable="false">
                <path d="m16 6 4 14M12 6v14M8 8v12M4 4v16"></path>
              </svg>
              <span data-i18n="documents.openLibrary">افتح فهرس المكتبة</span>
            </a>
          </div>
        </div>

        <div class="toolbar" id="documentsToolbar" hidden>
          <div class="field">
            <label for="documentSubject" data-i18n="field.subject">المادة</label>
            <select class="control" id="documentSubject"></select>
          </div>
          <div class="field">
            <label for="documentSearch" data-i18n="action.search">بحث</label>
            <input class="control" id="documentSearch" type="search" autocomplete="off"
                   data-i18n-placeholder="library.searchPlaceholder">
          </div>
          <span class="toolbar__spacer"></span>
          <span class="count-pill" id="documentCount">0</span>
        </div>

        <!-- Exactly one renderer for exactly one endpoint. -->
        <div id="userDocuments"></div>
      </main>
    </div>

    <footer class="footer" id="appFooter"></footer>
  </div>

  <script type="module" src="/user/scripts/documents.js"></script>
</body>
</html>
