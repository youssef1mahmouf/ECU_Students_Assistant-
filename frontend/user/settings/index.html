<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f5fb">
  <meta name="robots" content="noindex">
  <title>الإعدادات</title>
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="/shared/shell.css">
  <link rel="icon" href="/shared/favicon.svg" type="image/svg+xml">
  <script src="/shared/theme-boot.js"></script>
</head>
<body data-page-title="title.settings">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">تخطي إلى المحتوى</a>

  <div class="app">
    <header class="topbar" id="appHeader"></header>

    <div class="app__body">
      <aside class="sidebar" id="appSidebar"></aside>

      <main class="page" id="main">
        <div class="page-head">
          <div class="page-head__text">
            <p class="eyebrow" data-i18n="nav.settings">الإعدادات</p>
            <h1 data-i18n="settings.title">الإعدادات</h1>
            <p class="lead" data-i18n="settings.subtitle">تفضيلات العرض محفوظة في هذا المتصفح فقط.</p>
          </div>
        </div>

        <div class="stack" style="max-width:44rem">
          <!-- Theme. Real radios, so arrow keys work and the value is announced. -->
          <fieldset class="card">
            <legend class="card__title" data-i18n="theme.label">السمة</legend>
            <p class="hint" data-i18n="theme.note">محفوظة في هذا المتصفح فقط.</p>
            <div class="cluster" id="themeOptions" role="radiogroup" data-i18n-label="theme.label">
              <label class="tile" style="flex:0 1 12rem">
                <input class="visually-hidden" type="radio" name="theme" value="light">
                <span class="tile__icon" data-theme-icon="light"></span>
                <span class="tile__title" data-i18n="theme.light">المظهر الفاتح</span>
              </label>
              <label class="tile" style="flex:0 1 12rem">
                <input class="visually-hidden" type="radio" name="theme" value="dark">
                <span class="tile__icon tile__icon--accent" data-theme-icon="dark"></span>
                <span class="tile__title" data-i18n="theme.dark">المظهر الداكن</span>
              </label>
              <label class="tile" style="flex:0 1 12rem">
                <input class="visually-hidden" type="radio" name="theme" value="system">
                <span class="tile__icon tile__icon--info" data-theme-icon="system"></span>
                <span class="tile__title" data-i18n="theme.system">حسب النظام</span>
              </label>
            </div>
          </fieldset>

          <!-- Density -->
          <fieldset class="card">
            <legend class="card__title" data-i18n="theme.density">كثافة العرض</legend>
            <div class="segmented" id="densityOptions" role="radiogroup" data-i18n-label="theme.density">
              <label class="segmented__option">
                <input type="radio" name="density" value="comfortable" checked>
                <span data-i18n="theme.densityComfortable">مريحة</span></label>
              <label class="segmented__option">
                <input type="radio" name="density" value="compact">
                <span data-i18n="theme.densityCompact">مضغوطة</span></label>
            </div>
          </fieldset>

          <!-- Motion -->
          <fieldset class="card">
            <legend class="card__title" data-i18n="theme.motion">الحركة</legend>
            <div class="segmented" id="motionOptions" role="radiogroup" data-i18n-label="theme.motion">
              <label class="segmented__option">
                <input type="radio" name="motion" value="full" checked>
                <span data-i18n="theme.motionFull">كاملة</span></label>
              <label class="segmented__option">
                <input type="radio" name="motion" value="reduced">
                <span data-i18n="theme.motionReduced">مقلّلة</span></label>
            </div>
          </fieldset>

          <!-- Language -->
          <fieldset class="card">
            <legend class="card__title" data-i18n="theme.language">لغة الواجهة</legend>
            <div class="segmented" id="languageOptions" role="radiogroup" data-i18n-label="theme.language">
              <label class="segmented__option">
                <input type="radio" name="uilanguage" value="ar" checked>
                <span>العربية</span></label>
              <label class="segmented__option">
                <input type="radio" name="uilanguage" value="en">
                <span>English</span></label>
            </div>
          </fieldset>
        </div>
      </main>
    </div>

    <footer class="footer" id="appFooter"></footer>
  </div>

  <script type="module" src="/user/scripts/settings.js"></script>
</body>
</html>
