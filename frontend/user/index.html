<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7f2">
  <title>الرئيسية · بوابة المجموعات</title>
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/user/styles.css">
</head>
<body data-page-title="title.home">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">تخطي إلى المحتوى</a>
  <header class="topbar" id="appHeader"></header>

  <main id="main" class="shell">
    <div id="userBanner"></div>
    <section class="surface">
      <p class="eyebrow" data-i18n="nav.home">الرئيسية</p>
      <h1 data-i18n="user.welcome">أهلًا بك في مساحة مجموعتك</h1>
      <p class="subtext" id="homeLead" data-i18n="user.lead">المحتوى الذي يضيفه الأدمن لمجموعتك فقط.</p>
    </section>

    <section class="surface" aria-labelledby="my-groups">
      <h2 id="my-groups" data-i18n="user.groupsAvailable">المجموعات المتاحة</h2>
      <div class="group-grid" id="groupCards"><p class="empty" data-i18n="msg.loading">جار التحميل…</p></div>
    </section>

    <section class="surface" aria-labelledby="my-content">
      <h2 id="my-content" data-i18n="user.myContent">محتوى مجموعتي</h2>
      <div class="list" id="myRecords"><p class="empty" data-i18n="msg.loading">جار التحميل…</p></div>
    </section>
  </main>

  <footer class="shell" id="appFooter"></footer>
  <script type="module" src="/user/scripts/home.js"></script>
</body>
</html>
